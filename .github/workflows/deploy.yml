name: Deploy Frontend to Hostinger VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Next.js Storefront
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:5010/api' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}

  deploy:
    name: Sync & Deploy to Hostinger VPS
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            TARGET_DIR="${{ secrets.HOSTINGER_FRONTEND_DIR || '/var/www/Drop_Frontend' }}"
            echo "🚀 Deploying Storefront to $TARGET_DIR on Hostinger VPS..."
            
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Directory $TARGET_DIR does not exist. Creating and cloning..."
              mkdir -p "$TARGET_DIR"
              git clone https://github.com/${{ github.repository }}.git "$TARGET_DIR"
            fi
            
            cd "$TARGET_DIR"
            
            # Fetch and sync latest main
            git fetch origin main
            git reset --hard origin/main
            
            echo "📦 Installing dependencies and compiling Next.js production build..."
            npm ci
            npm run build
            
            # Restart or reload PM2 process
            if command -v pm2 &> /dev/null; then
              echo "🔄 Reloading PM2 process 'drop-frontend'..."
              pm2 reload drop-frontend || pm2 start npm --name "drop-frontend" -- start
              pm2 save
            fi
            
            echo "✅ Storefront deployment complete!"
